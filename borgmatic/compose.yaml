services:
  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic
    container_name: borgmatic
    volumes:
      - /lab/archive/borg/data:/mnt/borg-repository
      - /lab/archive/borg/cache:/root/.cache/borg
      - /lab/appdata/borgmatic/.config:/etc/borgmatic.d/
      - /lab/appdata/borgmatic/borg_keys:/root/.config/borg
      - /lab/appdata/borgmatic/.ssh:/root/.ssh
      # Source Dirs
      - /lab/appdata:/src/appdata
      - /lab/immich/:/src/photos
      - /lab/archive/nextcloud:/src/nextcloud
      - /lab/data/:/src/data
    restart: "no"
    environment:
      - TZ=Europe/London
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      - BACKUP_CRON=* * 31 2 *   # Impossible date — effectively disables it
    networks:
      - db_network
networks:
  db_network:
    external: true
