services:
  hp-scan:
    image: docker.io/manuc66/node-hp-scan-to:latest
    restart: unless-stopped
    hostname: hp-scan
    container_name: hp-scan
    environment:
      - IP=10.0.0.3
      - LABEL=Paperless
      - TZ=Europe/London
      - PATTERN="scan"_dd-mm-yyyy_hh-MM-ss
      - PGID=1000
      - PUID=1000
      - PAPERLESS_POST_DOCUMENT_URL=https://docs.piandchips.uk/api/documents/post_document/
      - PAPERLESS_TOKEN=${PAPERLESS_TOKEN}
    volumes:
      - /lab/appdata/paperless/hp-scan:/scan
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - /lab/appdata/paperless/redis:/data
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    container_name: paperless
    depends_on:
      - broker
    volumes:
      - /lab/appdata/paperless/data:/usr/src/paperless/data
      - /lab/appdata/paperless/media:/usr/src/paperless/media
      - /lab/appdata/paperless/export:/usr/src/paperless/export
      - /lab/appdata/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: https://docs.piandchips.uk
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: ${AUTH_PROVIDER}
    networks:
      - default
      - proxy-net
networks:
  default: null
  proxy-net:
    external: true
