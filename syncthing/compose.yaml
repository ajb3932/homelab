services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: syncthing
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/London
    volumes:
      - /lab/appdata/syncthing/config:/config
      - /pool/media/books:/sync/books
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
