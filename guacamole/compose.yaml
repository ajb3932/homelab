services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacamole-guacd
    hostname: guacamole-guacd
    restart: always
    volumes:
      - /lab/appdata/guacamole/drive:/drive:rw
      - /lab/appdata/guacamole/record:/record:rw
  postgres:
    image: postgres:15.2-alpine
    container_name: guacamole-postgress
    hostname: guacamole-postgress
    environment:
      PGDATA: /var/lib/postgresql/data/guacamole
      POSTGRES_DB: $POSTGRESQL_DATABASE
      POSTGRES_PASSWORD: $POSTGRESQL_PASSWORD
      POSTGRES_USER: $POSTGRESQL_USERNAME
    restart: always
    volumes:
      - /lab/appdata/guacamole/init:/docker-entrypoint-initdb.d:z
      - /lab/appdata/guacamole/data:/var/lib/postgresql/data:Z
  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: guacamole
    hostname: guacamole
    group_add:
      - "1000"
    depends_on:
      - guacd
      - postgres
    environment:
      API_SESSION_TIMEOUT: 600
      GUACD_HOSTNAME: $GUACD_HOSTNAME
      POSTGRESQL_DATABASE: $POSTGRESQL_DATABASE
      POSTGRESQL_HOSTNAME: $POSTGRESQL_HOSTNAME
      POSTGRESQL_PASSWORD: $POSTGRESQL_PASSWORD
      POSTGRESQL_USERNAME: $POSTGRESQL_USERNAME
      RECORDING_SEARCH_PATH: /record
      # OpenID Connect Configuration
      OPENID_ENABLED: $OPENID_ENABLED
      OPENID_AUTHORIZATION_ENDPOINT: $OPENID_AUTHORIZATION_ENDPOINT
      OPENID_JWKS_ENDPOINT: $OPENID_JWKS_ENDPOINT
      OPENID_ISSUER: $OPENID_ISSUER
      OPENID_CLIENT_ID: $OPENID_CLIENT_ID
      OPENID_REDIRECT_URI: $OPENID_REDIRECT_URI
      OPENID_SCOPE: $OPENID_SCOPE
      OPENID_USERNAME_CLAIM_TYPE: $OPENID_USERNAME_CLAIM_TYPE
      OPENID_GROUPS_CLAIM_TYPE: $OPENID_GROUPS_CLAIM_TYPE
      EXTENSION_PRIORITY: $EXTENSION_PRIORITY
    volumes:
      - /lab/appdata/guacamole/record:/record:rw
    restart: always
    ports: 
      8002:8080
    networks:
      - proxy-net
      - default
networks:
  default:
    driver: bridge
  proxy-net:
    external: true
