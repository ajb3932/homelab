services:
  modmanager:
    image: lscr.io/linuxserver/modmanager:latest
    container_name: modmanager
    environment:
      - DOCKER_MODS=linuxserver/mods:swag-dashboard|linuxserver/mods:universal-docker
    volumes:
      - /mnt/nvme/appdata/modmanager:/modcache
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
networks: {}
