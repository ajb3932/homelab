  grimmory:
    image: grimmory/grimmory:latest
    container_name: grimmory
    environment:
      - APP_USER_ID=${APP_USER_ID}
      - APP_GROUP_ID=${APP_GROUP_ID}
      - TZ=${TZ}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - GRIMMORY_PORT=${GRIMMORY_PORT}
    depends_on:
      grimmory-db:
        condition: service_healthy
    volumes:
      - /lab/appdata/media/grimmory/data:/app/data
      - /pool/media/books:/books
      - /lab/appdata/media/grimmory/bookdrop:/bookdrop
    restart: unless-stopped
    ports:
      - 6060:6060
    networks:
      - proxy-net
      - default
  grimmory-db:
    image: lscr.io/linuxserver/mariadb:11.4.5
    container_name: grimmory-db
    hostname: grimmory-db
    environment:
      - PUID=${DB_USER_ID}
      - PGID=${DB_GROUP_ID}
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /lab/appdata/media/grimmory/mariadb:/config
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mariadb-admin
        - ping
        - -h
        - localhost
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - db_network
      - default
networks:
  default:
    driver: bridge
  proxy-net:
    external: true
  db_network:
    external: true
