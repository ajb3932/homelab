  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=https://media.piandchips.uk
    volumes:
      - /lab/appdata/media/jellyfin:/config
      - /pool/media/:/media
    ports:
      - 7359:7359/udp
#     - 1900:1900/udp
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "18"
    restart: unless-stopped
    networks:
      - proxy-net
      - default
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - /lab/appdata/media/jellyseer:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status
        || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - proxy-net
      - default
